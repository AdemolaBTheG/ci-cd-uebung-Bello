name: SonarQube Cloud

on:
  # No path filter: every commit pushed to main must be analyzed.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze and check Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Temurin Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate SonarQube Cloud configuration
        shell: bash
        run: |
          for name in SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. See docs/sonar-setup.md."
              exit 1
            fi
          done
      - name: Build, test and analyze
        run: >-
          mvn --batch-mode --no-transfer-progress -DskipTests=false clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
      - name: Upload analysis metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-analysis
          path: |
            target/sonar/report-task.txt
            target/site/jacoco/jacoco.xml
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
